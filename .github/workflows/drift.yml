# .github/workflows/drift.yml
#
# Drift detection — runs nightly to detect out-of-band Azure resource changes.
# NEVER applies — detection only. Emits ::error:: annotation if drift is found.
#
# Job chain: drift-check-data ║ drift-check-core  (parallel, independently gated)
#
# Trigger:
#   schedule  — 02:00 UTC daily
#   workflow_dispatch — on-demand manual drift check
#
# Required secrets:
#   ARM_CLIENT_ID, ARM_CLIENT_SECRET, ARM_SUBSCRIPTION_ID, ARM_TENANT_ID
#   SQL_ADMIN_PASSWORD    — needed to satisfy data/ variable validation at plan time
#   JWT_SECRET_KEY        — needed to satisfy core/ jwt_secret_key validation at plan time
#
# Exit codes from terraform plan -detailed-exitcode:
#   0 = no changes      → success, no drift
#   1 = plan error      → infra is broken, needs investigation
#   2 = changes pending → drift detected, manual reconciliation required

name: Drift Detection

on:
  schedule:
    - cron: "0 2 * * *"   # 02:00 UTC daily
  workflow_dispatch:

env:
  ARM_CLIENT_ID:       ${{ secrets.ARM_CLIENT_ID }}
  ARM_CLIENT_SECRET:   ${{ secrets.ARM_CLIENT_SECRET }}
  ARM_SUBSCRIPTION_ID: ${{ secrets.ARM_SUBSCRIPTION_ID }}
  ARM_TENANT_ID:       ${{ secrets.ARM_TENANT_ID }}

jobs:
  # ─────────────────────────────────────────────────────────────────
  # data/ drift check — Resource Group + SQL Server + SQL Database
  # ─────────────────────────────────────────────────────────────────
  drift-check-data:
    name: Drift / data
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infrastructure/environments/dev/data
    steps:
      - uses: actions/checkout@v6

      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: "~1.6"
          terraform_wrapper: false

      - name: terraform init
        run: terraform init -input=false

      - name: Detect drift (never applies)
        run: |
          set +e
          terraform plan -detailed-exitcode -input=false \
            -var "sql_admin_password=${{ secrets.SQL_ADMIN_PASSWORD }}" \
            -out=tfplan.binary
          EXIT_CODE=$?
          set -e

          if [ $EXIT_CODE -eq 1 ]; then
            echo "::error::terraform plan errored in data/ (exit 1) — check ARM auth, backend config, and state integrity."
            exit 1
          elif [ $EXIT_CODE -eq 2 ]; then
            # Exit 2 = changes detected. Parse JSON to distinguish resource vs output-only changes.
            terraform show -json tfplan.binary > tfplan.json

            RESOURCE_CHANGES=$(cat tfplan.json | jq -r '[.resource_changes // [] | .[] | select(.change.actions != ["no-op"])] | length')
            OUTPUT_CHANGES=$(cat tfplan.json | jq -r '.output_changes // {} | length')

            if [ "$RESOURCE_CHANGES" -gt 0 ]; then
              # Real drift — resources changed outside Terraform
              cat tfplan.json | jq -r '.resource_changes[] | select(.change.actions != ["no-op"]) | "  - \(.address): \(.change.actions | join(", "))"'
              echo "::error file=infrastructure/environments/dev/data/main.tf::Drift detected in data/ layer — $RESOURCE_CHANGES resource(s) changed outside Terraform. Run infra.yml workflow_dispatch to reconcile."
              exit 1
            else
              # Output-only changes (e.g., connection_string from password rotation) — acceptable
              echo "ℹ️ Output-only changes detected ($OUTPUT_CHANGES output(s)) — no resource drift."
              echo "This is expected for computed attributes like connection_string (password is write-only)."
              exit 0
            fi
          fi
          echo "✅ No drift in data/ — state is consistent with Azure resources."

  # ─────────────────────────────────────────────────────────────────
  # core/ drift check — App Service + App Insights + diagnostic settings
  # Reads connection_string and sql_server_id from data/ state so that
  # the plan accurately reflects the live configuration (no false positives).
  # ─────────────────────────────────────────────────────────────────
  drift-check-core:
    name: Drift / core
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: "~1.6"
          terraform_wrapper: false

      - name: Read data/ outputs for core/ plan inputs
        id: data-outputs
        working-directory: infrastructure/environments/dev/data
        run: |
          terraform init -input=false
          CONN=$(terraform output -raw connection_string)
          echo "::add-mask::$CONN"
          echo "connection_string=$CONN" >> $GITHUB_OUTPUT

          SQL_SERVER_ID=$(terraform output -raw sql_server_id)
          echo "sql_server_id=$SQL_SERVER_ID" >> $GITHUB_OUTPUT

      - name: terraform init (core)
        working-directory: infrastructure/environments/dev/core
        run: terraform init -input=false

      - name: Detect drift (never applies)
        working-directory: infrastructure/environments/dev/core
        run: |
          set +e
          terraform plan -detailed-exitcode -input=false \
            -var "connection_string=${{ steps.data-outputs.outputs.connection_string }}" \
            -var "jwt_secret_key=${{ secrets.JWT_SECRET_KEY }}" \
            -var "sql_server_id=${{ steps.data-outputs.outputs.sql_server_id }}" \
            -out=tfplan.binary
          EXIT_CODE=$?
          set -e

          if [ $EXIT_CODE -eq 1 ]; then
            echo "::error::terraform plan errored in core/ (exit 1) — check ARM auth, backend config, and state integrity."
            exit 1
          elif [ $EXIT_CODE -eq 2 ]; then
            # Exit 2 = changes detected. Parse JSON to distinguish resource vs output-only changes.
            terraform show -json tfplan.binary > tfplan.json

            # Count only resources with actual changes (not no-op)
            RESOURCE_CHANGES=$(cat tfplan.json | jq -r '[.resource_changes // [] | .[] | select(.change.actions != ["no-op"])] | length')
            OUTPUT_CHANGES=$(cat tfplan.json | jq -r '.output_changes // {} | length')

            if [ "$RESOURCE_CHANGES" -gt 0 ]; then
              # Real drift — resources changed outside Terraform
              cat tfplan.json | jq -r '[.resource_changes[] | select(.change.actions != ["no-op"])] | .[] | "  - \(.address): \(.change.actions | join(", "))"'
              echo "::error file=infrastructure/environments/dev/core/main.tf::Drift detected in core/ layer — $RESOURCE_CHANGES resource(s) changed outside Terraform. Run infra.yml workflow_dispatch to reconcile."
              exit 1
            else
              # Output-only changes (e.g., SWA api_key rotation) — acceptable
              echo "ℹ️ Output-only changes detected ($OUTPUT_CHANGES output(s)) — no resource drift."
              echo "This is expected for computed attributes like static_web_app_api_key."
              exit 0
            fi
          fi
          echo "✅ No drift in core/ — state is consistent with Azure resources."

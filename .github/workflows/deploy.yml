# .github/workflows/deploy.yml
#
# Application deployment pipeline — builds, tests, migrates, deploys, and validates.
# Job chain: preflight → build-test → migrate → deploy → pester-health → slot-swap
#
# Trigger:
#   push to src/**         — auto-deploy on API code changes
#   workflow_dispatch      — manual deploy
#
# Required secrets:
#   ARM_CLIENT_ID, ARM_CLIENT_SECRET, ARM_SUBSCRIPTION_ID, ARM_TENANT_ID
#
# Required GitHub environment:
#   production  — required reviewers for slot-swap (Main branch only)

name: Deploy

permissions:
  checks: write
  contents: read

on:
  push:
    branches: [001-platform-core, Main]
    paths: [src/**]
  workflow_dispatch:

env:
  ARM_CLIENT_ID:       ${{ secrets.ARM_CLIENT_ID }}
  ARM_CLIENT_SECRET:   ${{ secrets.ARM_CLIENT_SECRET }}
  ARM_SUBSCRIPTION_ID: ${{ secrets.ARM_SUBSCRIPTION_ID }}
  ARM_TENANT_ID:       ${{ secrets.ARM_TENANT_ID }}
  DOTNET_VERSION:      "8.0.x"

jobs:
  # ─────────────────────────────────────────────────────────────────
  # 1. Preflight — verify Azure auth and read terraform outputs
  # ─────────────────────────────────────────────────────────────────
  preflight:
    name: Preflight checks
    runs-on: ubuntu-latest
    outputs:
      app_service_name:    ${{ steps.tf-outputs.outputs.app_service_name }}
      resource_group_name: ${{ steps.tf-outputs.outputs.resource_group_name }}
    steps:
      - uses: actions/checkout@v6

      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: "~1.6"
          terraform_wrapper: false

      - name: Azure CLI login
        run: |
          az login --service-principal \
            --username "$ARM_CLIENT_ID" \
            --password "$ARM_CLIENT_SECRET" \
            --tenant "$ARM_TENANT_ID"
          az account set --subscription "$ARM_SUBSCRIPTION_ID"

      - name: Read core outputs from terraform state
        id: tf-outputs
        working-directory: infrastructure/environments/dev/core
        run: |
          set -euo pipefail
          terraform init -input=false

          # terraform output -raw emits diagnostic box-drawing chars to stdout in TF 1.6+
          # when state is empty; use -json instead which returns parseable {} on empty state.
          TF_JSON=$(terraform output -json 2>/dev/null || echo "{}")

          APP_SERVICE_NAME=$(echo "$TF_JSON" | jq -r '.app_service_name.value // empty')
          RESOURCE_GROUP_NAME=$(echo "$TF_JSON" | jq -r '.resource_group_name.value // empty')

          if [ -z "$APP_SERVICE_NAME" ] || [ -z "$RESOURCE_GROUP_NAME" ]; then
            echo "::error::Terraform outputs not found in infrastructure/environments/dev/core state."
            echo "::error::Run Infrastructure workflow (environment=dev) to completion first, then rerun Deploy."
            echo "::error::Expected outputs: app_service_name, resource_group_name"
            exit 1
          fi

          echo "app_service_name=$APP_SERVICE_NAME" >> "$GITHUB_OUTPUT"
          echo "resource_group_name=$RESOURCE_GROUP_NAME" >> "$GITHUB_OUTPUT"

      - name: Verify App Service exists
        run: |
          az webapp show \
            --name "${{ steps.tf-outputs.outputs.app_service_name }}" \
            --resource-group "${{ steps.tf-outputs.outputs.resource_group_name }}" \
            --query "state" --output tsv

  # ─────────────────────────────────────────────────────────────────
  # 2. Build and test — restore, build, run all tests, publish package
  # ─────────────────────────────────────────────────────────────────
  build-test:
    name: Build and test
    needs: preflight
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore dependencies
        run: dotnet restore

      - name: Build (Release)
        run: dotnet build --no-restore -c Release

      - name: Run unit + integration tests (hard gate)
        run: |
          dotnet test tests/Innoventity.API.Tests/Innoventity.API.Tests.csproj \
            --no-build -c Release \
            --filter "FullyQualifiedName~Innoventity.API.Tests.Unit|FullyQualifiedName~Innoventity.API.Tests.Integration" \
            --logger "trx;LogFileName=unit-integration.trx" \
            --results-directory TestResults

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: test-results-unit-integration
          path: TestResults/**/*.trx
          if-no-files-found: error

      - name: Publish test results to Summary
        uses: dorny/test-reporter@v3
        if: always()
        with:
          name: Unit + Integration Tests
          path: TestResults/**/*.trx
          reporter: dotnet-trx
          fail-on-error: false
          fail-on-empty: true
          list-tests: all

      - name: Publish API
        run: dotnet publish src/Innoventity.API/Innoventity.API.csproj -c Release -o publish/

      - name: Create deployment zip
        run: cd publish && zip -r ../api.zip .

      - uses: actions/upload-artifact@v7
        with:
          name: api-package-${{ github.run_id }}
          path: api.zip
          if-no-files-found: error

  # ─────────────────────────────────────────────────────────────────
  # 3. Migrate — apply EF Core database migrations
  # ─────────────────────────────────────────────────────────────────
  migrate:
    name: Apply EF Core migrations
    needs: [preflight, build-test]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Install dotnet-ef tool
        run: dotnet tool install --global dotnet-ef

      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: "~1.6"
          terraform_wrapper: false

      - name: Restore API project for EF tooling
        run: dotnet restore src/Innoventity.API/Innoventity.API.csproj

      - name: Build API project for EF tooling
        run: dotnet build src/Innoventity.API/Innoventity.API.csproj --no-restore -c Release

      - name: Detect and remediate schema drift
        working-directory: infrastructure/environments/dev/data
        run: |
          set -euo pipefail
          terraform init -input=false
          CONN=$(terraform output -json | jq -re '.connection_string.value')
          echo "::add-mask::$CONN"
          
          # Install sqlcmd for drift detection (Ubuntu 24.04)
          curl https://packages.microsoft.com/keys/microsoft.asc | sudo tee /etc/apt/trusted.gpg.d/microsoft.asc
          sudo add-apt-repository "$(wget -qO- https://packages.microsoft.com/config/ubuntu/$(lsb_release -rs)/prod.list)"
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y mssql-tools18 unixodbc-dev
          
          # Parse connection string components
          SERVER=$(echo "$CONN" | sed -n 's/.*Server=\([^;]*\).*/\1/p')
          DATABASE=$(echo "$CONN" | sed -n 's/.*Database=\([^;]*\).*/\1/p')
          USER=$(echo "$CONN" | sed -n 's/.*User Id=\([^;]*\).*/\1/p')
          PASSWORD=$(echo "$CONN" | sed -n 's/.*Password=\([^;]*\).*/\1/p')
          
          echo "Checking for schema drift..."
          
          # Check if migration exists but table doesn't (schema drift)
          DRIFT_CHECK=$(/opt/mssql-tools18/bin/sqlcmd -S "$SERVER" -d "$DATABASE" -U "$USER" -P "$PASSWORD" -C -h-1 -Q "
            SET NOCOUNT ON;
            SELECT CASE 
              WHEN EXISTS (SELECT 1 FROM __EFMigrationsHistory WHERE MigrationId = '20260209204020_AddActorEntity')
                AND OBJECT_ID('Actors', 'U') IS NULL
              THEN 1 
              ELSE 0 
            END AS DriftDetected
          " | tr -d '[:space:]')
          
          if [ "$DRIFT_CHECK" = "1" ]; then
            echo "⚠️ Schema drift detected - applying remediation"
            /opt/mssql-tools18/bin/sqlcmd -S "$SERVER" -d "$DATABASE" -U "$USER" -P "$PASSWORD" -C \
              -i "$GITHUB_WORKSPACE/infrastructure/scripts/fix-schema-drift.sql"
            echo "✓ Remediation complete - migration will be re-applied"
          else
            echo "✓ No schema drift detected - proceeding with normal migration"
          fi

      - name: Apply migrations
        working-directory: infrastructure/environments/dev/data
        run: |
          set -euo pipefail
          terraform init -input=false
          # Read connection_string directly from state and pass it to dotnet-ef in the same
          # shell process. Never write it to $GITHUB_OUTPUT — GitHub secret scanning blocks
          # any output value that contains SQL_ADMIN_PASSWORD.
          CONN=$(terraform output -json | jq -re '.connection_string.value')
          echo "::add-mask::$CONN"
          cd "$GITHUB_WORKSPACE"
          dotnet ef database update \
            --project src/Innoventity.API/Innoventity.API.csproj \
            --startup-project src/Innoventity.API/Innoventity.API.csproj \
            --configuration Release \
            --no-build \
            --connection "$CONN"

      - name: Validate schema integrity
        working-directory: infrastructure/environments/dev/data
        run: |
          set -euo pipefail
          CONN=$(terraform output -json | jq -re '.connection_string.value')
          
          # Parse connection string
          SERVER=$(echo "$CONN" | sed -n 's/.*Server=\([^;]*\).*/\1/p')
          DATABASE=$(echo "$CONN" | sed -n 's/.*Database=\([^;]*\).*/\1/p')
          USER=$(echo "$CONN" | sed -n 's/.*User Id=\([^;]*\).*/\1/p')
          PASSWORD=$(echo "$CONN" | sed -n 's/.*Password=\([^;]*\).*/\1/p')
          
          echo "Validating database schema..."
          
          # Verify critical tables exist
          MISSING_TABLES=$(/opt/mssql-tools18/bin/sqlcmd -S "$SERVER" -d "$DATABASE" -U "$USER" -P "$PASSWORD" -C -h-1 -Q "
            SET NOCOUNT ON;
            SELECT 
              CASE WHEN OBJECT_ID('Actors', 'U') IS NULL THEN 'Actors,' ELSE '' END +
              CASE WHEN OBJECT_ID('Innovations', 'U') IS NULL THEN 'Innovations,' ELSE '' END +
              CASE WHEN OBJECT_ID('Industries', 'U') IS NULL THEN 'Industries,' ELSE '' END +
              CASE WHEN OBJECT_ID('Bids', 'U') IS NULL THEN 'Bids,' ELSE '' END AS MissingTables
          " | tr -d '[:space:]')
          
          if [ -n "$MISSING_TABLES" ]; then
            echo "❌ Validation FAILED - Missing tables: $MISSING_TABLES"
            exit 1
          fi
          
          echo "✓ All critical tables present"
          
          # Verify migration history is complete
          MIGRATION_COUNT=$(/opt/mssql-tools18/bin/sqlcmd -S "$SERVER" -d "$DATABASE" -U "$USER" -P "$PASSWORD" -C -h-1 -Q "
            SET NOCOUNT ON;
            SELECT COUNT(*) FROM __EFMigrationsHistory
          " | tr -d '[:space:]')
          
          echo "✓ Migration history contains $MIGRATION_COUNT migrations"
          
          if [ "$MIGRATION_COUNT" -lt "9" ]; then
            echo "⚠️  Warning: Expected at least 9 migrations, found $MIGRATION_COUNT"
          fi
          
          echo "✓ Schema validation passed"

  # ─────────────────────────────────────────────────────────────────
  # 4. Deploy — zip-deploy API package to App Service
  # ─────────────────────────────────────────────────────────────────
  deploy:
    name: Deploy to App Service
    needs: [preflight, build-test, migrate]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: api-package-${{ github.run_id }}
          path: .

      - name: Azure CLI login
        run: |
          az login --service-principal \
            --username "$ARM_CLIENT_ID" \
            --password "$ARM_CLIENT_SECRET" \
            --tenant "$ARM_TENANT_ID"
          az account set --subscription "$ARM_SUBSCRIPTION_ID"

      - name: Deploy to App Service (zip deploy)
        run: |
          # On Main branch, deploy to staging slot (if it exists) so it can be
          # validated before swap. Staging slots require Standard (S1+) plan and
          # are only provisioned for prod in Terraform — guard with existence check.
          # On feature branches, or when no staging slot exists, deploy directly
          # to the production slot.
          SLOT_ARG=""
          if [[ "$GITHUB_REF" == "refs/heads/Main" ]]; then
            SLOT_EXISTS=$(az webapp deployment slot list \
              --name "${{ needs.preflight.outputs.app_service_name }}" \
              --resource-group "${{ needs.preflight.outputs.resource_group_name }}" \
              --query "[?name=='staging'] | length(@)" --output tsv 2>/dev/null || echo 0)
            if [[ "$SLOT_EXISTS" != "0" ]]; then
              SLOT_ARG="--slot staging"
            else
              echo "::warning::No staging slot found — deploying directly to production slot. Upgrade App Service plan to Standard (S1+) to enable blue-green deployments."
            fi
          fi
          az webapp deploy \
            --name "${{ needs.preflight.outputs.app_service_name }}" \
            --resource-group "${{ needs.preflight.outputs.resource_group_name }}" \
            --src-path api.zip \
            --type zip \
            --async false \
            $SLOT_ARG

  # ─────────────────────────────────────────────────────────────────
  # 5. Pester health check — validates GET /health returns 200 + Healthy
  #    Fails the pipeline if the app is not healthy after deployment.
  # ─────────────────────────────────────────────────────────────────
  pester-health:
    name: Pester / health
    needs: [preflight, deploy]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Run HealthCheck.Tests.ps1
        shell: pwsh
        env:
          APP_SERVICE_NAME: ${{ needs.preflight.outputs.app_service_name }}
        run: |
          Install-Module Pester -Force -SkipPublisherCheck -RequiredVersion 5.6.1
          $config = New-PesterConfiguration
          $config.Run.Path  = './infrastructure/tests/pester/HealthCheck.Tests.ps1'
          $config.Run.Exit  = $true
          $config.TestResult.Enabled      = $true
          $config.TestResult.OutputPath   = 'pester-health-results.xml'
          $config.TestResult.OutputFormat = 'NUnitXml'
          Invoke-Pester -Configuration $config

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: pester-health-results
          path: pester-health-results.xml

  # ─────────────────────────────────────────────────────────────────
  # 6. Slot swap — promote staging → production (Main branch only)
  #    Requires 'production' GitHub environment with required reviewers configured.
  #    Requires Standard (S1+) App Service plan — staging slot not available on Basic.
  # ─────────────────────────────────────────────────────────────────
  slot-swap:
    name: Swap staging → production slot
    needs: [preflight, pester-health]
    runs-on: ubuntu-latest
    if: ${{ github.ref == 'refs/heads/Main' }}
    environment: production
    steps:
      - name: Azure CLI login
        run: |
          az login --service-principal \
            --username "$ARM_CLIENT_ID" \
            --password "$ARM_CLIENT_SECRET" \
            --tenant "$ARM_TENANT_ID"
          az account set --subscription "$ARM_SUBSCRIPTION_ID"

      - name: Check staging slot exists
        id: check-slot
        run: |
          SLOT_EXISTS=$(az webapp deployment slot list \
            --name "${{ needs.preflight.outputs.app_service_name }}" \
            --resource-group "${{ needs.preflight.outputs.resource_group_name }}" \
            --query "[?name=='staging'] | length(@)" --output tsv 2>/dev/null || echo 0)
          echo "exists=$SLOT_EXISTS" >> "$GITHUB_OUTPUT"
          if [[ "$SLOT_EXISTS" == "0" ]]; then
            echo "::warning::No staging slot found — slot-swap skipped. Upgrade App Service plan to Standard (S1+) to enable blue-green deployments."
          fi

      - name: Swap slots
        if: steps.check-slot.outputs.exists != '0'
        run: |
          az webapp deployment slot swap \
            --name "${{ needs.preflight.outputs.app_service_name }}" \
            --resource-group "${{ needs.preflight.outputs.resource_group_name }}" \
            --slot staging \
            --target-slot production

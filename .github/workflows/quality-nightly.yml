name: Nightly Quality Gates

on:
  schedule:
    - cron: "30 1 * * *"   # daily 01:30 UTC
  workflow_dispatch:

env:
  DOTNET_VERSION: "8.0.x"

jobs:
  mutation-tests:
    name: Mutation (Stryker)
    runs-on: ubuntu-latest
    if: ${{ github.ref == 'refs/heads/Main' }}
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore
        run: dotnet restore

      - name: Install Stryker
        run: dotnet tool install --global dotnet-stryker

      - name: Run Stryker
        working-directory: src/Innoventity.API
        run: dotnet stryker --config-file stryker-config.json

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: mutation-results
          path: src/Innoventity.API/StrykerOutput/**

      - name: Post mutation score summary
        if: always()
        shell: pwsh
        run: |
          $report = Get-Content "src/Innoventity.API/StrykerOutput/reports/mutation-report.json" | ConvertFrom-Json
          $mutants = $report.files.PSObject.Properties.Value.mutants
          $killed   = ($mutants | Where-Object { $_.status -in @('Killed','Timeout') }).Count
          $survived = ($mutants | Where-Object { $_.status -eq 'Survived' }).Count
          $noCov    = ($mutants | Where-Object { $_.status -eq 'NoCoverage' }).Count
          $total    = $killed + $survived
          $score    = if ($total -gt 0) { [math]::Round($killed / $total * 100, 1) } else { 0 }
          $icon     = if ($score -ge 80) { '✅' } elseif ($score -ge 70) { '⚠️' } else { '❌' }
          $summary  = @"
          ## 🧬 Mutation Testing Results

          | Metric | Value |
          |--------|-------|
          | **Mutation Score** | **$score% $icon** |
          | Killed / Total | $killed / $total |
          | Survived | $survived |
          | No Coverage | $noCov |
          | Thresholds | High: 80% · Low: 70% · Break: 60% |

          "@
          $summary | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Encoding utf8 -Append

  e2e-tests:
    name: E2E Journeys
    runs-on: ubuntu-latest
    if: ${{ github.ref == 'refs/heads/Main' }}
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build --no-restore -c Release

      - name: Run E2E journeys
        run: |
          dotnet test tests/Innoventity.API.Tests/Innoventity.API.Tests.csproj \
            --no-build -c Release \
            --filter "FullyQualifiedName~Innoventity.API.Tests.E2E" \
            --logger "trx;LogFileName=e2e.trx" \
            --results-directory TestResults-E2E

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: e2e-results
          path: TestResults-E2E/**/*.trx
          if-no-files-found: error

<div class="login-container">
  <mat-card>
    <mat-card-header>
      <mat-card-title>Log In to Innoventity</mat-card-title>
    </mat-card-header>

    <mat-card-content>
      <form [formGroup]="loginForm" (ngSubmit)="onSubmit()">
        <mat-form-field appearance="outline" class="full-width">
          <mat-label>Email</mat-label>
          <input matInput type="email" formControlName="email" autocomplete="email" />
          @if (emailError()) {
            <mat-error>{{ emailError() }}</mat-error>
          }
        </mat-form-field>

        <mat-form-field appearance="outline" class="full-width">
          <mat-label>Actor Type</mat-label>
          <mat-select formControlName="actorType">
            @for (type of actorTypes; track type.value) {
              <mat-option [value]="type.value">{{ type.label }}</mat-option>
            }
          </mat-select>
          @if (actorTypeError()) {
            <mat-error>{{ actorTypeError() }}</mat-error>
          }
        </mat-form-field>

        <mat-form-field appearance="outline" class="full-width">
          <mat-label>Password</mat-label>
          <input matInput type="password" formControlName="password" autocomplete="current-password" />
          @if (passwordError()) {
            <mat-error>{{ passwordError() }}</mat-error>
          }
        </mat-form-field>

        @if (errorMessage()) {
          <div class="error-banner" role="alert">
            {{ errorMessage() }}
          </div>
        }

        <button
          mat-raised-button
          color="primary"
          type="submit"
          class="full-width"
          [disabled]="!isFormValid() || isLoading()"
        >
          @if (isLoading()) {
            <mat-spinner diameter="20"></mat-spinner>
          } @else {
            Log In
          }
        </button>

        <!-- TODO: Uncomment when register component is implemented
        <div class="register-link">
          Don't have an account? <a routerLink="/register">Register here</a>
        </div>
        -->
      </form>
    </mat-card-content>
  </mat-card>
</div>
